<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Squad Chat</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap">
<style>
/* Layout: black sidebar (brand, channels, online, profile) + white message pane with a Slack-style list. Sidebar becomes a drawer on phones. */
:root {
  --side: #0a0a0a;
  --side-2: #161616;
  --side-line: #262626;
  --side-fg: #f5f5f4;
  --side-muted: #8a8a85;
  --gold: #d4af37;
  --gold-soft: #e9cf7a;
  --gold-ink: #8a6a12;
  --on-gold: #0a0a0a;
  --bg: #ffffff;
  --bg-2: #fafaf8;
  --hover: #f6f4ee;
  --fg: #0a0a0a;
  --muted: #6b6b66;
  --line: #ebe9e3;
  --online: #22a06b;
  --danger: #d1383d;
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-brand: "Sora", "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111111; --bg-2: #0d0d0d; --hover: #1a1a18; --fg: #f2f1ee; --muted: #9a9993; --line: #232321; --gold-ink: #e3c25a;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111111; --bg-2: #0d0d0d; --hover: #1a1a18; --fg: #f2f1ee; --muted: #9a9993; --line: #232321; --gold-ink: #e3c25a;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--side); color: var(--fg); font-family: var(--font); font-size: 15px; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
svg { display: block; }

.app { height: 100%; display: grid; grid-template-columns: 264px 1fr; }

/* ---------- sidebar ---------- */
.side { background: var(--side); color: var(--side-fg); display: flex; flex-direction: column; min-height: 0;
  padding-left: env(safe-area-inset-left, 0px); }
.ws { display: flex; align-items: center; gap: 12px; padding: 18px 18px 16px; border-bottom: 1px solid var(--side-line); }
.mark { width: 36px; height: 36px; border-radius: 10px; flex: none; display: grid; place-items: center;
  background: linear-gradient(145deg, var(--gold-soft), var(--gold) 55%, #a8841f); color: var(--on-gold); }
.ws-name { font-family: var(--font-brand); font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
.ws-text { min-width: 0; flex: 1; }
.ws-name-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ws-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-edit { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--side-muted); flex: none; opacity: .6; }
.ws-edit[hidden] { display: none; }
.ws:hover .ws-edit, .ws-edit:focus-visible { opacity: 1; }
.ws-edit:hover { background: var(--side-2); color: var(--gold); }
.ws-form { padding: 12px 18px 14px; border-bottom: 1px solid var(--side-line); display: flex; flex-direction: column; gap: 8px; }
.ws-form input { width: 100%; background: var(--side-2); border: 1px solid var(--gold); color: var(--side-fg); border-radius: 8px;
  padding: 8px 10px; font: inherit; font-family: var(--font-brand); font-weight: 600; }
.ws-form input:focus { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent); }
.ws-form-btns { display: flex; justify-content: flex-end; gap: 6px; }
.ws-form-btns button { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 7px; color: var(--side-muted); }
.ws-form-btns button:hover { color: var(--side-fg); background: var(--side-2); }
.ws-form-btns .ws-save { background: var(--gold); color: var(--on-gold); }
.ws-form-btns .ws-save:hover { background: var(--gold-soft); color: var(--on-gold); }
.ws-sub { font-size: 12px; color: var(--side-muted); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.ws-sub i { width: 7px; height: 7px; border-radius: 50%; background: var(--online); }
.side-scroll { flex: 1; overflow-y: auto; padding: 14px 10px; display: flex; flex-direction: column; gap: 22px; }
.section-h { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--side-muted);
  padding: 0 10px; margin: 0 0 6px; display: flex; justify-content: space-between; }
.channels { display: flex; flex-direction: column; gap: 1px; }
.chan { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px; border-radius: 8px; color: var(--side-muted);
  font-weight: 500; font-size: 14.5px; text-align: left; transition: background .12s, color .12s; }
.chan svg { flex: none; opacity: .7; }
.chan:hover { background: var(--side-2); color: var(--side-fg); }
.chan[aria-current="true"] { background: var(--side-2); color: var(--side-fg); box-shadow: inset 2px 0 0 var(--gold); }
.chan[aria-current="true"] svg { color: var(--gold); opacity: 1; }
.chan.unread { color: var(--side-fg); font-weight: 700; }
.chan .badge { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
.people { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.person { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 8px; font-size: 14px; color: var(--side-fg); min-width: 0; }
.person.note { color: var(--side-muted); }
.person .pav { position: relative; flex: none; }
.person .pav::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%;
  background: var(--online); border: 2px solid var(--side); }
.person .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.person .tag { color: var(--side-muted); font-size: 12px; }
.person .where { margin-left: auto; color: var(--side-muted); font-size: 12px; flex: none; }
.me { border-top: 1px solid var(--side-line); padding: 12px 14px max(12px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; }
.me-row { display: flex; align-items: center; gap: 10px; }
.me-row .who { min-width: 0; flex: 1; }
.me-row .who b { display: block; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me-row .who span { font-size: 12px; color: var(--side-muted); }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--side-muted); flex: none; }
.icon-btn:hover { background: var(--side-2); color: var(--side-fg); }
.icon-btn[aria-pressed="false"] { opacity: .5; }
.nick-edit { display: flex; gap: 6px; }
.nick-edit input { flex: 1; min-width: 0; background: var(--side-2); border: 1px solid var(--side-line); color: var(--side-fg);
  border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px; }
.nick-edit input:focus { outline: none; border-color: var(--gold); }
.nick-edit button { background: var(--gold); color: var(--on-gold); font-weight: 600; font-size: 13px; padding: 0 12px; border-radius: 8px; }

.avatar { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; font-weight: 600; font-size: 13px;
  color: #fff; overflow: hidden; flex: none; letter-spacing: .02em; }
.avatar.sm { width: 26px; height: 26px; border-radius: 7px; font-size: 11px; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }

/* ---------- main ---------- */
.main { background: var(--bg); display: flex; flex-direction: column; min-width: 0; min-height: 0;
  border-top-left-radius: 14px; margin-top: 6px; overflow: hidden; }
.head { display: flex; align-items: center; gap: 12px; padding-block: 14px; padding-left: 24px;
  padding-right: max(24px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.menu-btn { display: none; color: var(--fg); }
.menu-btn:hover { background: var(--hover); color: var(--fg); }
.head-title { min-width: 0; }
.head-title h2 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 6px; }
.head-title h2 svg { color: var(--gold-ink); }
.head-title p { margin: 2px 0 0; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stack { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: none; }
.stack .faces { display: flex; }
.stack .faces .avatar { border: 2px solid var(--bg); margin-left: -8px; }
.stack .faces .avatar:first-child { margin-left: 0; }
.stack .count { font-size: 13px; color: var(--muted); font-weight: 500; }

.banner { margin: 12px 24px 0; padding: 10px 14px; border-radius: 10px; font-size: 13.5px; color: var(--fg);
  background: color-mix(in srgb, var(--gold) 12%, var(--bg)); border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent); }

.feed { flex: 1; overflow-y: auto; min-height: 0; padding-block: 8px 12px; display: flex; flex-direction: column; }
.intro { padding: 32px 24px 18px; display: flex; flex-direction: column; gap: 8px; margin-top: auto; }
.intro .big-ic { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; background: var(--side); color: var(--gold); }
.intro h3 { margin: 6px 0 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); max-width: 60ch; line-height: 1.5; }
.loading { margin: auto; color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 10px; }
.spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--gold); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.day { display: flex; align-items: center; gap: 12px; padding: 14px 24px 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
.day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.msg { position: relative; display: grid; grid-template-columns: 36px 1fr; column-gap: 12px; padding: 3px 24px;
  padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.msg.first { padding-top: 10px; }
.msg:hover, .msg.show-tools { background: var(--hover); }
.msg .gutter { font-size: 10.5px; color: transparent; text-align: right; padding-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.msg:hover .gutter { color: var(--muted); }
.msg .body { min-width: 0; }
.msg .meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 1px; }
.msg .meta b { font-weight: 700; font-size: 14.5px; }
.msg .meta .you-pill { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--gold-ink);
  border: 1px solid color-mix(in srgb, var(--gold) 50%, transparent); border-radius: 4px; padding: 0 5px; }
.msg .meta time { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.msg .text { line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg .text.jumbo { font-size: 32px; line-height: 1.25; }
.msg .text a { color: var(--gold-ink); text-decoration: underline; text-underline-offset: 2px; }
.msg.pending .text { color: var(--muted); }
.msg.new { animation: fade .25s ease-out; }
@keyframes fade { from { background: color-mix(in srgb, var(--gold) 14%, transparent); } }

.tools { position: absolute; top: -14px; right: 20px; display: none; align-items: center; gap: 1px; padding: 3px;
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 6px 20px rgb(0 0 0 / .12); z-index: 3; }
.msg:hover .tools, .msg:focus-within .tools, .msg.show-tools .tools { display: flex; }
.tools button { width: 30px; height: 28px; border-radius: 7px; font-size: 16px; display: grid; place-items: center; }
.tools button:hover { background: var(--hover); }
.tools .sep { width: 1px; height: 18px; background: var(--line); margin: 0 3px; }
.tools .del { color: var(--muted); }
.tools .del:hover { color: var(--danger); }
.tools .del.armed { width: auto; padding: 0 8px; font-size: 12px; font-weight: 600; color: var(--danger); }

.reacts { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
.react { display: flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 99px; font-size: 13px;
  border: 1px solid var(--line); background: var(--bg-2); }
.react b { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.react:hover { border-color: var(--gold); }
.react.on { background: color-mix(in srgb, var(--gold) 14%, var(--bg)); border-color: var(--gold); }
.react.on b { color: var(--gold-ink); }

.typing { height: 24px; padding: 0 24px; font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.typing .dots { display: inline-flex; gap: 3px; }
.typing .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); animation: bob 1.1s infinite; }
.typing .dots i:nth-child(2) { animation-delay: .15s; } .typing .dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bob { 0%, 60%, 100% { opacity: .35; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .msg.new, .typing .dots i, .spinner { animation: none; } }

.composer-wrap { padding-block: 0 max(16px, env(safe-area-inset-bottom, 0px)); padding-left: 24px; padding-right: max(24px, env(safe-area-inset-right, 0px)); position: relative; }
.composer { border: 1px solid var(--line); border-radius: 14px; background: var(--bg); transition: border-color .15s, box-shadow .15s; }
.composer:focus-within { border-color: var(--gold); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 20%, transparent); }
.composer textarea { display: block; width: 100%; resize: none; border: 0; background: transparent; color: var(--fg); font: inherit;
  line-height: 1.45; padding: 13px 16px 4px; max-height: 160px; }
.composer textarea:focus { outline: none; }
.composer textarea:disabled { cursor: not-allowed; }
.bar { display: flex; align-items: center; gap: 4px; padding: 6px 8px 8px 10px; }
.bar .tool { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.bar .tool:hover, .bar .tool[aria-expanded="true"] { background: var(--hover); color: var(--fg); }
.bar .hint { font-size: 12px; color: var(--muted); margin-left: 6px; }
.send { margin-left: auto; height: 34px; padding: 0 14px; border-radius: 9px; background: var(--gold); color: var(--on-gold);
  font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 7px; transition: filter .12s, opacity .12s; }
.send:hover:not(:disabled) { filter: brightness(1.06); }
.send:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }

.picker { position: absolute; bottom: calc(100% - 6px); left: 24px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 12px 32px rgb(0 0 0 / .16); padding: 8px; display: grid; grid-template-columns: repeat(8, 36px); gap: 2px; z-index: 5; }
.picker button { width: 36px; height: 36px; border-radius: 8px; font-size: 20px; }
.picker button:hover { background: var(--hover); }

.scrim { display: none; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .side { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 20; transform: translateX(-100%); transition: transform .22s ease;
    padding-top: env(safe-area-inset-top, 0px); }
  .app.drawer .side { transform: none; }
  .app.drawer .scrim { display: block; position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 15; }
  .main { border-radius: 0; margin-top: 0; }
  .head { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); gap: 8px; }
  .menu-btn { display: grid; }
  .head-title p, .stack .count, .bar .hint { display: none; }
  .msg { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .day, .typing, .intro { padding-left: 16px; padding-right: 16px; }
  .composer-wrap { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  .banner { margin: 10px 16px 0; }
  .picker { left: 12px; grid-template-columns: repeat(6, 36px); }
  .tools { right: 12px; }
}
@media (max-width: 760px) and (prefers-reduced-motion: reduce) { .side { transition: none; } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-hash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M5 9h14M4 15h14M10 3 8 21M16 3l-2 18"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path fill="currentColor" d="M3.4 20.4 21 12 3.4 3.6 3.4 10.2 15 12 3.4 13.8z"/></symbol>
  <symbol id="i-smile" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1 1.3 2.2 2 3.5 2s2.5-.7 3.5-2"/></g><circle cx="9" cy="10" r="1.2" fill="currentColor"/><circle cx="15" cy="10" r="1.2" fill="currentColor"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15zM10 21h4"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></symbol>
  <symbol id="i-crown" viewBox="0 0 24 24"><path fill="currentColor" d="M3 7l4.5 4L12 4l4.5 7L21 7l-2 11H5z"/></symbol>
</svg>

<div class="app" id="app">
  <aside class="side" id="side">
    <div class="ws">
      <div class="mark"><svg width="20" height="20"><use href="#i-crown"/></svg></div>
      <div class="ws-text">
        <div class="ws-name-row"><div class="ws-name" id="ws-name">Squad Chat</div>
          <button class="ws-edit" id="ws-edit" type="button" title="Rename chat" aria-label="Rename chat" hidden><svg width="14" height="14"><use href="#i-edit"/></svg></button></div>
        <div class="ws-sub"><i></i><span id="ws-online">Connecting</span></div>
      </div>
    </div>
    <form class="ws-form" id="ws-form" hidden>
      <input id="ws-input" maxlength="32" autocomplete="off" aria-label="Chat name">
      <div class="ws-form-btns"><button type="button" id="ws-cancel">Cancel</button><button type="submit" class="ws-save">Save</button></div>
    </form>
    <div class="side-scroll">
      <div>
        <p class="section-h">Channels</p>
        <nav class="channels" id="channels"></nav>
      </div>
      <div>
        <p class="section-h"><span>Online now</span><span id="online-n"></span></p>
        <ul class="people" id="people"><li class="person note">Checking who's here…</li></ul>
      </div>
    </div>
    <div class="me">
      <div class="me-row" id="me-row">
        <div id="me-av"></div>
        <div class="who"><b id="me-name">You</b><span>Active</span></div>
        <button class="icon-btn" id="edit-nick" type="button" title="Change your name" aria-label="Change your name"><svg width="17" height="17"><use href="#i-edit"/></svg></button>
        <button class="icon-btn" id="sound" type="button" title="Message sound" aria-label="Message sound" aria-pressed="true"><svg width="17" height="17"><use href="#i-bell"/></svg></button>
      </div>
      <form class="nick-edit" id="nick-form" hidden>
        <input id="nick" maxlength="24" placeholder="Your name in chat" autocomplete="off" aria-label="Your name in chat">
        <button type="submit">Save</button>
      </form>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="head">
      <button class="icon-btn menu-btn" id="menu" type="button" aria-label="Open channels"><svg width="20" height="20"><use href="#i-menu"/></svg></button>
      <div class="head-title">
        <h2><svg width="16" height="16"><use href="#i-hash"/></svg><span id="chan-title">general</span></h2>
        <p id="chan-topic">Whatever's on your mind</p>
      </div>
      <div class="stack"><div class="faces" id="faces"></div><span class="count" id="online-count"></span></div>
    </header>
    <div class="banner" id="banner" hidden></div>
    <section class="feed" id="feed" aria-live="polite">
      <div class="loading"><span class="spinner"></span>Loading messages</div>
    </section>
    <div class="typing" id="typing"></div>
    <div class="composer-wrap">
      <div class="picker" id="picker" hidden></div>
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="Message #general" maxlength="2000" aria-label="Message"></textarea>
        <div class="bar">
          <button class="tool" id="emoji-btn" type="button" aria-label="Emoji" aria-expanded="false"><svg width="19" height="19"><use href="#i-smile"/></svg></button>
          <span class="hint" id="status"><b>Enter</b> to send · <b>Shift + Enter</b> for a new line</span>
          <button class="send" id="send" type="submit" disabled>Send<svg width="14" height="14"><use href="#i-send"/></svg></button>
        </div>
      </form>
    </div>
  </main>
</div>

<script>
(() => {
  const CHANNELS = [
    { id: "general", topic: "Whatever's on your mind" },
    { id: "memes", topic: "Post the funniest thing you saw today" },
    { id: "games", topic: "Who's hopping on tonight?" },
    { id: "late-night", topic: "For the 2am thoughts" },
  ];
  const EMOJI = ["😂", "💀", "🔥", "😭", "👀", "🙏", "💯", "🫡", "😎", "🤝", "❤️", "👍", "🎮", "🍕", "😤", "🥶"];
  const REACTS = ["🔥", "😂", "💀", "👍", "❤️"];
  const PALETTE = ["#1f1f1f", "#a8841f", "#3d3d3a", "#7a5c12", "#2b2b28", "#b8952e", "#4a4a45", "#6b5310"];

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  let db = null, user = null, room = null, me = null, uid = null;
  let current = store.get("sq.chan", "general");
  if (!CHANNELS.find(c => c.id === current)) current = "general";
  let unsubFeed = null, loadTimer = null;
  let msgs = [], pending = new Map(), latest = {}, peers = [], profiles = {};
  let canWrite = true, firstFeed = true;
  let nick = store.get("sq.nick", "");

  const colorFor = (id) => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
  const initials = (n) => (n || "?").trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
  const nameOf = (id, n) => n || (profiles[id] && profiles[id].name) || "Someone";

  function avatarEl(id, name, small) {
    const d = document.createElement("div");
    d.className = "avatar" + (small ? " sm" : "");
    d.style.background = colorFor(id || name);
    const p = profiles[id];
    if (p && p.avatarUrl && !p.avatarUrl.startsWith("data:")) { const img = document.createElement("img"); img.src = p.avatarUrl; img.alt = ""; d.append(img); }
    else d.textContent = initials(name);
    return d;
  }
  const icon = (id, s = 16) => { const ns = "http://www.w3.org/2000/svg"; const svg = document.createElementNS(ns, "svg"); svg.setAttribute("width", s); svg.setAttribute("height", s); const u = document.createElementNS(ns, "use"); u.setAttribute("href", "#" + id); svg.append(u); return svg; };

  // ---------- drawer (phones) ----------
  const app = $("app");
  $("menu").onclick = () => app.classList.add("drawer");
  $("scrim").onclick = () => app.classList.remove("drawer");

  // ---------- channels ----------
  function renderChannels() {
    const nav = $("channels"); nav.textContent = "";
    for (const c of CHANNELS) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chan";
      b.setAttribute("aria-current", c.id === current ? "true" : "false");
      b.append(icon("i-hash", 15), document.createTextNode(c.id));
      const seen = Number(store.get("sq.seen." + c.id, "0"));
      if (c.id !== current && latest[c.id] && latest[c.id] > seen) { b.classList.add("unread"); const dot = document.createElement("span"); dot.className = "badge"; b.append(dot); }
      b.onclick = () => { switchChannel(c.id); app.classList.remove("drawer"); };
      nav.append(b);
    }
  }
  function setHeader() {
    const c = CHANNELS.find(x => x.id === current);
    $("chan-title").textContent = current;
    $("chan-topic").textContent = c.topic;
    input.placeholder = "Message #" + current;
  }
  function switchChannel(id) {
    if (id === current) return;
    current = id; store.set("sq.chan", id);
    pending.clear(); msgs = [];
    setHeader(); renderChannels();
    if (room) room.presence({ chan: id, typing: null });
    subscribeFeed(); renderPeers();
  }

  // ---------- feed ----------
  function subscribeFeed() {
    if (unsubFeed) unsubFeed();
    if (!db) return;
    firstFeed = true;
    $("feed").innerHTML = '<div class="loading"><span class="spinner"></span>Loading messages</div>';
    clearTimeout(loadTimer);
    loadTimer = setTimeout(() => showBanner("Can't reach the chat right now. It will catch up on its own when the connection is back."), 10000);
    const chan = current;
    unsubFeed = db.collection("channels/" + chan + "/messages").orderBy("ts", "desc").limit(150).onSnapshot((snap) => {
      if (chan !== current) return;
      if (!snap.metadata.fromCache) { clearTimeout(loadTimer); if (canWrite) hideBanner(); }
      const before = new Set(msgs.map(m => m.id));
      msgs = snap.docs.map(d => ({ id: d.id, ...d.data() })).reverse();
      for (const m of msgs) pending.delete(m.id);
      if (!firstFeed && msgs.some(m => !before.has(m.id) && m.by !== uid)) ping();
      if (msgs.length) { latest[chan] = msgs[msgs.length - 1].ts; store.set("sq.seen." + chan, String(latest[chan])); }
      render(firstFeed ? null : new Set(msgs.filter(m => !before.has(m.id)).map(m => m.id)));
      firstFeed = false;
    }, (e) => { clearTimeout(loadTimer); showBanner("The chat stopped updating (" + e.code + "). Reopen the page to reconnect."); });
  }
  function watchUnread() {
    for (const c of CHANNELS) {
      db.collection("channels/" + c.id + "/messages").orderBy("ts", "desc").limit(1).onSnapshot((s) => {
        if (s.docs[0]) { latest[c.id] = s.docs[0].data().ts; if (c.id === current) store.set("sq.seen." + c.id, String(latest[c.id])); renderChannels(); }
      }, () => {});
    }
  }

  const dayFmt = new Intl.DateTimeFormat(undefined, { weekday: "long", month: "long", day: "numeric" });
  const timeFmt = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });
  const dayLabel = (d) => { const t = new Date(); const y = new Date(Date.now() - 864e5);
    if (d.toDateString() === t.toDateString()) return "Today"; if (d.toDateString() === y.toDateString()) return "Yesterday"; return dayFmt.format(d); };
  const onlyEmoji = (t) => /\p{Extended_Pictographic}/u.test(t) && /^(\p{Extended_Pictographic}|\p{Emoji_Component}|‍|️|\s)+$/u.test(t) && [...t.replace(/\s/g, "")].length <= 6;

  function linkify(el, text) {
    const re = /(https?:\/\/[^\s<]+[^\s<.,:;"')\]!?])/g; let last = 0, m;
    while ((m = re.exec(text))) {
      el.append(document.createTextNode(text.slice(last, m.index)));
      const a = document.createElement("a"); a.href = m[0]; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = m[0];
      el.append(a); last = m.index + m[0].length;
    }
    el.append(document.createTextNode(text.slice(last)));
  }

  async function render(newIds) {
    const feed = $("feed");
    const all = [...msgs, ...pending.values()].sort((a, b) => a.ts - b.ts);
    const ids = [...new Set(all.flatMap(m => [m.by, ...Object.values(m.reactions || {}).flatMap(o => Object.keys(o || {}))]).filter(Boolean))];
    if (user && ids.length) { try { Object.assign(profiles, await user.profiles(ids)); } catch {} }
    const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 140;
    feed.textContent = "";

    const intro = document.createElement("div"); intro.className = "intro";
    const ic = document.createElement("div"); ic.className = "big-ic"; ic.append(icon("i-hash", 24));
    const h = document.createElement("h3"); h.textContent = "Welcome to #" + current;
    const p = document.createElement("p"); p.textContent = all.length ? "This is the start of the #" + current + " channel. " + CHANNELS.find(c => c.id === current).topic + "."
      : "No messages here yet. Say something and everyone in the squad sees it instantly.";
    intro.append(ic, h, p); feed.append(intro);

    let lastDay = "";
    all.forEach((m, i) => {
      const d = new Date(m.ts), day = d.toDateString();
      if (day !== lastDay) { const s = document.createElement("div"); s.className = "day"; s.textContent = dayLabel(d); feed.append(s); lastDay = day; }
      const prev = all[i - 1];
      const grouped = prev && prev.by === m.by && (prev.nick || "") === (m.nick || "") && m.ts - prev.ts < 5 * 60e3 && new Date(prev.ts).toDateString() === day;
      const mine = m.by && m.by === uid;
      const name = nameOf(m.by, m.nick);

      const row = document.createElement("div");
      row.className = "msg" + (grouped ? "" : " first") + (m._pending ? " pending" : "") + (newIds && newIds.has(m.id) ? " new" : "");
      if (grouped) { const g = document.createElement("div"); g.className = "gutter"; g.textContent = timeFmt.format(d).replace(/\s?[AP]M$/i, ""); row.append(g); }
      else row.append(avatarEl(m.by || name, name));

      const body = document.createElement("div"); body.className = "body";
      if (!grouped) {
        const meta = document.createElement("div"); meta.className = "meta";
        const n = document.createElement("b"); n.textContent = name; meta.append(n);
        if (mine) { const y = document.createElement("span"); y.className = "you-pill"; y.textContent = "You"; meta.append(y); }
        const t = document.createElement("time"); t.textContent = m._pending ? "Sending…" : timeFmt.format(d); meta.append(t);
        body.append(meta);
      }
      const tx = document.createElement("div"); tx.className = "text" + (onlyEmoji(m.text) ? " jumbo" : ""); linkify(tx, m.text);
      body.append(tx);

      const chips = Object.entries(m.reactions || {}).map(([e, who]) => [e, Object.keys(who || {}).filter(k => who[k])]).filter(([, w]) => w.length);
      if (chips.length) {
        const wrap = document.createElement("div"); wrap.className = "reacts";
        for (const [e, w] of chips) {
          const c = document.createElement("button"); c.type = "button"; c.className = "react" + (w.includes(uid) ? " on" : "");
          c.append(document.createTextNode(e)); const n = document.createElement("b"); n.textContent = w.length; c.append(n);
          c.title = w.map(id => id === uid ? "You" : nameOf(id)).join(", ");
          c.onclick = () => toggleReact(m, e);
          wrap.append(c);
        }
        body.append(wrap);
      }
      row.append(body);

      if (!m._pending && canWrite && db && uid) {
        const tools = document.createElement("div"); tools.className = "tools";
        for (const r of REACTS) { const rb = document.createElement("button"); rb.type = "button"; rb.textContent = r; rb.title = "React with " + r; rb.onclick = (ev) => { ev.stopPropagation(); toggleReact(m, r); }; tools.append(rb); }
        if (mine) {
          const sep = document.createElement("span"); sep.className = "sep"; tools.append(sep);
          const del = document.createElement("button"); del.type = "button"; del.className = "del"; del.title = "Delete message"; del.append(icon("i-trash", 15));
          del.onclick = (ev) => { ev.stopPropagation(); confirmDelete(del, m); }; tools.append(del);
        }
        row.append(tools);
        row.onclick = (ev) => { if (ev.target.closest("a,.react")) return; document.querySelectorAll(".msg.show-tools").forEach(x => x !== row && x.classList.remove("show-tools")); row.classList.toggle("show-tools"); };
      }
      feed.append(row);
    });
    const sentByMe = newIds && all.some(m => newIds.has(m.id) && m.by === uid);
    if (nearBottom || !newIds || sentByMe) feed.scrollTop = feed.scrollHeight;
  }

  function confirmDelete(btn, m) {
    if (btn.classList.contains("armed")) { db.doc("channels/" + current + "/messages/" + m.id).delete().catch(writeFailed); return; }
    btn.classList.add("armed"); btn.textContent = "Delete?";
    setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = ""; btn.append(icon("i-trash", 15)); } }, 2500);
  }
  function toggleReact(m, e) {
    if (!uid || !canWrite || !db) return;
    const on = !!(m.reactions && m.reactions[e] && m.reactions[e][uid]);
    db.doc("channels/" + current + "/messages/" + m.id).update({ reactions: { [e]: { [uid]: !on } } }).catch(writeFailed);
  }

  // ---------- composer ----------
  const input = $("input"), sendBtn = $("send");
  const autosize = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; };
  const refreshSend = () => { sendBtn.disabled = !input.value.trim() || !canWrite || !db || !uid; };
  let typingOff = null;
  input.addEventListener("input", () => {
    autosize(); refreshSend(); store.set("sq.draft", input.value);
    if (room) { room.presence({ typing: input.value.trim() ? current : null }); clearTimeout(typingOff); typingOff = setTimeout(() => room.presence({ typing: null }), 4000); }
  });
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); } });
  $("composer").addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !db || !canWrite || !uid) return;
    const ref = db.collection("channels/" + current + "/messages").doc();
    const body = { text, by: uid, nick: nick || "", ts: Date.now(), reactions: {} };
    pending.set(ref.id, { id: ref.id, ...body, _pending: true });
    input.value = ""; store.set("sq.draft", ""); autosize(); refreshSend(); closePicker();
    if (room) room.presence({ typing: null });
    render(new Set([ref.id]));
    try { await ref.set(body); }
    catch (err) { pending.delete(ref.id); input.value = text; autosize(); refreshSend(); render(); writeFailed(err); }
  });
  function writeFailed(err) {
    if (err && err.code === "invalid_argument") {
      canWrite = false; refreshSend(); input.disabled = true;
      input.placeholder = "You can read this chat but can't post yet";
      showBanner("You can read along, but sending is off for your account. Ask whoever shared this to add you as an Editor.");
    } else if (err && err.code === "quota_exceeded") showBanner("The chat is full. Delete some old messages to make room.");
    else showBanner("That message didn't send (" + (err && err.code || "network") + "). Try again in a moment.");
  }

  // emoji picker
  const picker = $("picker"), emojiBtn = $("emoji-btn");
  for (const q of EMOJI) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = q; b.title = q;
    b.onclick = () => { const s = input.selectionStart ?? input.value.length; input.value = input.value.slice(0, s) + q + input.value.slice(input.selectionEnd ?? s);
      input.focus(); input.selectionStart = input.selectionEnd = s + q.length; input.dispatchEvent(new Event("input")); };
    picker.append(b);
  }
  function closePicker() { picker.hidden = true; emojiBtn.setAttribute("aria-expanded", "false"); }
  emojiBtn.onclick = (e) => { e.stopPropagation(); const open = picker.hidden; picker.hidden = !open; emojiBtn.setAttribute("aria-expanded", String(open)); };
  document.addEventListener("click", (e) => { if (!picker.hidden && !picker.contains(e.target) && e.target !== emojiBtn) closePicker(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closePicker(); app.classList.remove("drawer"); } });

  // ---------- profile / nickname ----------
  const nickInput = $("nick"), nickForm = $("nick-form");
  function renderMe() {
    const n = nick || (me && me.name) || "You";
    $("me-name").textContent = n;
    const av = $("me-av"); av.textContent = ""; av.append(avatarEl(uid || n, n));
  }
  $("edit-nick").onclick = () => { nickForm.hidden = !nickForm.hidden; if (!nickForm.hidden) { nickInput.value = nick; nickInput.focus(); nickInput.select(); } };
  nickForm.addEventListener("submit", (e) => {
    e.preventDefault();
    nick = nickInput.value.trim().slice(0, 24); store.set("sq.nick", nick);
    nickForm.hidden = true; renderMe();
    if (room) room.presence({ nick });
  });

  // ---------- sound ----------
  const soundBtn = $("sound");
  let soundOn = store.get("sq.sound", "1") === "1";
  soundBtn.setAttribute("aria-pressed", String(soundOn));
  soundBtn.onclick = () => { soundOn = !soundOn; store.set("sq.sound", soundOn ? "1" : "0"); soundBtn.setAttribute("aria-pressed", String(soundOn)); soundBtn.title = soundOn ? "Message sound on" : "Message sound off"; };
  let actx = null;
  document.addEventListener("pointerdown", () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } }, { once: true });
  function ping() {
    if (!soundOn || !actx) return;
    try {
      const t = actx.currentTime;
      [[1046.5, 0], [1568, 0.07]].forEach(([f, off]) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t + off); g.gain.exponentialRampToValueAtTime(0.09, t + off + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + off + 0.35);
        o.connect(g).connect(actx.destination); o.start(t + off); o.stop(t + off + 0.36);
      });
    } catch {}
  }

  // ---------- presence ----------
  async function renderPeers() {
    const viewers = peers.filter(p => p.kind === "viewer");
    const byKey = new Map();
    for (const p of viewers) { const k = p.by || p.peer; const cur = byKey.get(k); if (!cur || p.updatedAt > cur.updatedAt) byKey.set(k, p); }
    const list = [...byKey.values()].sort((a, b) => b.isMe - a.isMe);
    const ids = list.map(p => p.by).filter(Boolean);
    if (user && ids.length) { try { Object.assign(profiles, await user.profiles(ids)); } catch {} }

    const ul = $("people"); ul.textContent = "";
    for (const p of list) {
      const n = nameOf(p.by, p.presence && p.presence.nick);
      const li = document.createElement("li"); li.className = "person";
      const w = document.createElement("span"); w.className = "pav"; w.append(avatarEl(p.by || p.peer, n, true));
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = n;
      li.append(w, nm);
      if (p.isMe) { const y = document.createElement("span"); y.className = "tag"; y.textContent = "you"; li.append(y); }
      const ch = p.presence && p.presence.chan;
      if (ch && CHANNELS.find(c => c.id === ch)) { const wh = document.createElement("span"); wh.className = "where"; wh.textContent = "#" + ch; li.append(wh); }
      ul.append(li);
    }
    if (!list.length) ul.innerHTML = '<li class="person note">Just you for now</li>';
    $("online-n").textContent = list.length || "";
    $("ws-online").textContent = list.length + " online";

    const here = list.filter(p => p.presence && p.presence.chan === current);
    const faces = $("faces"); faces.textContent = "";
    here.slice(0, 4).forEach(p => { const n = nameOf(p.by, p.presence.nick); const a = avatarEl(p.by || p.peer, n, true); a.title = n; faces.append(a); });
    $("online-count").textContent = here.length ? here.length + " in channel" : "";

    const typers = [...new Set(viewers.filter(p => !p.isMe && p.presence && p.presence.typing === current).map(p => nameOf(p.by, p.presence.nick)))];
    const t = $("typing"); t.textContent = "";
    if (typers.length) {
      const dots = document.createElement("span"); dots.className = "dots"; dots.innerHTML = "<i></i><i></i><i></i>";
      const label = typers.length === 1 ? typers[0] + " is typing…" : typers.length === 2 ? typers.join(" and ") + " are typing…" : "Several people are typing…";
      t.append(dots, document.createTextNode(label));
    }
  }

  // ---------- chat name (owner can rename) ----------
  const DEFAULT_NAME = "Squad Chat";
  let chatName = store.get("sq.name", DEFAULT_NAME), nameVersion = null;
  const wsForm = $("ws-form"), wsInput = $("ws-input");
  function applyName(n) {
    chatName = (n || "").trim() || DEFAULT_NAME;
    $("ws-name").textContent = chatName; document.title = chatName; store.set("sq.name", chatName);
  }
  applyName(chatName);
  function watchName() {
    db.doc("meta/settings").onSnapshot((s) => { applyName(s.exists ? s.data().name : DEFAULT_NAME); }, () => {});
  }
  $("ws-edit").onclick = () => { wsForm.hidden = false; wsInput.value = chatName; wsInput.focus(); wsInput.select(); };
  $("ws-cancel").onclick = () => { wsForm.hidden = true; };
  wsInput.addEventListener("keydown", (e) => { if (e.key === "Escape") { e.stopPropagation(); wsForm.hidden = true; } });
  wsForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const n = wsInput.value.trim().slice(0, 32) || DEFAULT_NAME;
    wsForm.hidden = true;
    if (n === chatName) return;
    const old = chatName; applyName(n);
    try { await db.doc("meta/settings").set({ name: n }); }
    catch (err) { applyName(old); showBanner("Couldn't rename the chat (" + (err && err.code || "network") + "). Only the chat's owner can change its name."); }
  });

  function showBanner(text) { const b = $("banner"); b.textContent = text; b.hidden = false; }
  function hideBanner() { $("banner").hidden = true; }

  // ---------- boot ----------
  renderChannels(); setHeader(); renderMe();
  input.value = store.get("sq.draft", ""); autosize();

  if (!window.claude || !window.claude.use) {
    $("feed").innerHTML = '<div class="intro"><h3>Open this on claude.ai</h3><p>The chat runs inside the Claude artifact viewer. Open the shared link there to start talking.</p></div>';
    return;
  }
  (async () => {
    [db, user, room] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("room")]);
    if (user) {
      try { me = await user.me(); uid = me.id; } catch {}
      if (!nick && me && me.name) { nick = me.name.split(" ")[0]; store.set("sq.nick", nick); }
      renderMe();
      try { if ((await user.can("data.write")) === false) writeFailed({ code: "invalid_argument" }); } catch {}
    }
    if (!db) {
      $("feed").innerHTML = '<div class="intro"><h3>Sign in to chat</h3><p>Sign in to claude.ai and reopen this link to read and send messages.</p></div>';
      input.disabled = true; return;
    }
    if (!uid) { canWrite = false; input.disabled = true; input.placeholder = "Sign in to send messages"; }
    subscribeFeed(); watchUnread(); watchName();
    if (user && user.isOwner()) $("ws-edit").hidden = false;
    if (room) {
      room.presence({ chan: current, nick, typing: null });
      room.onPeers((ch) => { peers = ch.peers; renderPeers(); });
      if (room.onConnection) room.onConnection((ok) => { $("status").innerHTML = ok ? "<b>Enter</b> to send · <b>Shift + Enter</b> for a new line" : "Reconnecting…"; });
    } else {
      $("people").innerHTML = '<li class="person note">Online list isn\'t available here</li>';
      $("ws-online").textContent = "Live";
    }
    refreshSend();
  })();
})();
</script>

</body>
</html>
